<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MeetZy</title>
  <style>
    body { margin: 0; background: #F4EFE6; font-family: Inter, Arial, sans-serif; }
    html { overflow-y: scroll; }
  </style>
<link rel="stylesheet" href="meetzy-ajakan.css">
<script src="app.js" defer></script>
</head>
<body>
  <div id="meetzy-frame" style="width: 1440px; min-height: 900px; position: relative; background: #F4EFE6; overflow: hidden">
  <div style="width: 1440px; height: 72px; left: 0px; top: 0px; position: absolute; background: #6B1D2A">
    <form class="meetzy-search" action="cari-partner.html" style="width: 544px; height: 40px; left: 448px; top: 16px; position: absolute; background: #FFFCF6; border-radius: 8px; outline: 1px #E4D8CF solid; outline-offset: -1px"><input name="q" type="search" placeholder="Cari partner, lomba, atau keahlian" aria-label="Cari partner, lomba, atau keahlian"><button type="submit">Cari</button></form>
    <a href="profil.html" aria-label="Buka Profil Saya" title="Profil Saya" class="meetzy-profile-link" style="width: 40px; height: 40px; left: 1344px; top: 16px; position: absolute; background: #F2E1E4; border-radius: 8px"><div style="left: 10px; top: 11.50px; position: absolute; color: #6B1D2A; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">PL</div></a>
    <div style="width: 104px; height: 40px; left: 108px; top: 16px; position: absolute">
      <div style="width: 56px; height: 40px; left: 0px; top: 0px; position: absolute; background: #BFD02E; border-radius: 12px"></div>
      <div style="left: 0px; top: 6.50px; position: absolute; color: white; font-size: 22px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">MeetZy</div>
    </div>
  </div>
  <nav aria-label="Navigasi utama" style="width: 1440px; height: 56px; left: 0px; top: 72px; position: absolute; background: #6B1D2A">
    <a href="index.html" aria-current="page" style="width: 104px; height: 40px; left: 56px; top: 8px; position: absolute; background: #F2E1E4; border-radius: 8px; text-decoration: none"><div style="left: 23.50px; top: 11.50px; position: absolute; color: #6B1D2A; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">Beranda</div></a>
    <a href="cari-partner.html" style="width: 128px; height: 40px; left: 168px; top: 8px; position: absolute; background: #FFFCF6; border-radius: 8px; outline: 1px #E4D8CF solid; outline-offset: -1px; text-decoration: none"><div style="left: 22.50px; top: 11.50px; position: absolute; color: #30201F; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">Cari Partner</div></a>
    <a href="profil.html" style="width: 96px; height: 40px; left: 304px; top: 8px; position: absolute; background: #FFFCF6; border-radius: 8px; outline: 1px #E4D8CF solid; outline-offset: -1px; text-decoration: none"><div style="left: 29.50px; top: 11.50px; position: absolute; color: #30201F; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">Profil</div></a>
    <a href="ajakan.html" style="width: 152px; height: 40px; left: 408px; top: 8px; position: absolute; background: #FFFCF6; border-radius: 8px; outline: 1px #E4D8CF solid; outline-offset: -1px; text-decoration: none"><div style="left: 21.50px; top: 11.50px; position: absolute; color: #30201F; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">Ajakan & Status</div></a>
    <a href="tim-dosen.html" style="width: 128px; height: 40px; left: 568px; top: 8px; position: absolute; background: #FFFCF6; border-radius: 8px; outline: 1px #E4D8CF solid; outline-offset: -1px; text-decoration: none"><div style="left: 21px; top: 11.50px; position: absolute; color: #30201F; font-size: 14px; font-family: Inter, Arial, sans-serif; font-weight: 700; word-wrap: break-word">Tim & Dosen</div></a>
  </nav>
<main class="mz-layout">
  <h1>Beranda</h1>
  <p class="mz-intro">Temukan rekan terbaik untuk meraih prestasi bersama.</p>
  <div class="mz-columns">
    <div class="mz-stack">
      <aside id="lengkapi-profil" class="mz-panel mz-onboard" hidden><strong>Lengkapi profil dan minat lomba</strong><a class="mz-secondary" href="profil.html?edit=1">Lengkapi Profil</a></aside>
      <section class="mz-panel"><h2>Rekomendasi Partner</h2><div id="beranda-kandidat" class="mz-project-grid"></div></section>
      <section class="mz-panel"><h2>Ringkasan Status Ajakan</h2><div id="beranda-statistik" class="mz-stat-grid"></div><ul class="mz-recents" id="beranda-ajakan"></ul><a class="mz-secondary" href="ajakan.html">Lihat Semua Ajakan</a></section>
    </div>
    <aside class="mz-stack">
      <section class="mz-panel mz-accent"><h2>Buat Kebutuhan Tim</h2>
        <form id="form-kebutuhan-beranda" class="mz-need-form">
          <label>Lomba<input name="lomba" placeholder="Contoh: GEMASTIK 2026" maxlength="80" required></label>
          <label>Peran dibutuhkan<select name="peran" required><option value="">Pilih peran</option></select></label>
          <label>Jumlah<input type="number" name="jumlah" min="1" max="20" value="1" required></label>
          <label>Tenggat<input type="date" name="tenggat" required></label>
          <button class="meetzy-action">Simpan Kebutuhan</button><p role="status"></p>
        </form>
      </section>
      <section class="mz-panel"><h2>Tenggat Terdekat</h2><ul class="mz-deadlines" id="beranda-tenggat"></ul></section>
    </aside>
  </div>
</main>
</div>
<script src="meetzy-desktop.js"></script>
</body>
</html>
